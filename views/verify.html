<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Certificate Verification – Gram Panchayat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .verify-card{background:#fff;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:40px;width:100%;max-width:540px;text-align:center}
    .logo{font-size:2.5rem;margin-bottom:8px}
    .title{font-size:1.4rem;font-weight:700;color:#1e293b;margin-bottom:4px}
    .subtitle{color:#64748b;font-size:.9rem;margin-bottom:28px}
    /* Result states */
    .result{border-radius:14px;padding:24px;margin-top:24px;display:none}
    .result.show{display:block}
    .result.valid{background:#d1fae5;border:2px solid #6ee7b7}
    .result.invalid{background:#fee2e2;border:2px solid #fca5a5}
    .result.loading-state{background:#eff6ff;border:2px solid #bfdbfe}
    .result-icon{font-size:3rem;margin-bottom:12px}
    .result.valid .result-icon{color:#10b981}
    .result.invalid .result-icon{color:#ef4444}
    .result.loading-state .result-icon{color:#2563eb}
    .result h2{font-size:1.3rem;font-weight:700;margin-bottom:4px}
    .result.valid h2{color:#065f46}
    .result.invalid h2{color:#991b1b}
    .result.loading-state h2{color:#1d4ed8}
    .cert-detail{background:#fff;border-radius:10px;padding:16px;margin-top:16px;text-align:left}
    .cert-detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:.9rem}
    .cert-detail-row:last-child{border-bottom:none}
    .cert-detail-row label{color:#64748b;font-weight:500}
    .cert-detail-row span{color:#1e293b;font-weight:600;text-align:right}
    /* Manual verify */
    .manual-section{margin-top:28px;padding-top:24px;border-top:1px solid #f1f5f9}
    .manual-section h3{font-size:.95rem;font-weight:600;margin-bottom:12px;color:#475569}
    .input-row{display:flex;gap:8px}
    .input-row input{flex:1;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:.875rem;outline:none}
    .input-row input:focus{border-color:#2563eb}
    .btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.875rem;display:inline-flex;align-items:center;gap:6px;transition:.2s}
    .btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
    .spin{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .back-link{margin-top:24px;display:block;color:#64748b;font-size:.85rem;text-decoration:none}
    .back-link:hover{color:#2563eb}
  </style>
</head>
<body>
<div class="verify-card">
  <div class="logo">🏛️</div>
  <div class="title">Certificate Verification</div>
  <div class="subtitle">Gram Panchayat Digital Services Portal</div>

  <!-- Auto-verify via URL hash -->
  <div class="result loading-state" id="auto-result">
    <div class="result-icon"><i class="fas fa-spinner spin"></i></div>
    <h2>Verifying Certificate…</h2>
    <p style="color:#3b82f6;font-size:.9rem">Please wait while we verify this certificate.</p>
  </div>

  <!-- Manual verify -->
  <div class="manual-section">
    <h3><i class="fas fa-search"></i> Verify by Certificate ID or Hash</h3>
    <div class="input-row">
      <input type="text" id="manual-input" placeholder="Enter Certificate ID or Hash"/>
      <button class="btn btn-primary" onclick="manualVerify()"><i class="fas fa-shield-alt"></i> Verify</button>
    </div>
  </div>

  <div class="result" id="manual-result"></div>

  <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portal</a>
</div>

<script>
window.onload = async () => {
  const hash = window.location.pathname.split('/verify/')[1];
  if (!hash) {
    document.getElementById('auto-result').style.display = 'none';
    return;
  }
  try {
    const res = await fetch(`/api/verify/hash/${hash}`);
    const data = await res.json();
    showResult('auto-result', data);
  } catch (e) {
    showResult('auto-result', { valid: false, message: 'Verification failed. Network error.' });
  }
};

async function manualVerify() {
  const input = document.getElementById('manual-input').value.trim();
  if (!input) { alert('Please enter a certificate ID or hash'); return; }

  const el = document.getElementById('manual-result');
  el.className = 'result loading-state show';
  el.innerHTML = '<div class="result-icon"><i class="fas fa-spinner spin"></i></div><h2>Verifying…</h2>';

  try {
    // Try as hash first (longer strings), else as ID
    const isHash = input.length === 64;
    const url = isHash ? `/api/verify/hash/${input}` : `/api/verify/certificate/${input}`;
    const res = await fetch(url);
    const data = await res.json();
    showResult('manual-result', data);
  } catch(e) {
    showResult('manual-result', { valid: false, message: 'Verification failed. Try again.' });
  }
}

function showResult(elId, data) {
  const el = document.getElementById(elId);
  el.classList.add('show');

  if (data.valid) {
    el.className = 'result valid show';
    const c = data.certificate;
    el.innerHTML = `
      <div class="result-icon"><i class="fas fa-check-circle"></i></div>
      <h2>✅ Certificate is Valid</h2>
      <p style="color:#065f46;font-size:.9rem">${data.message}</p>
      <div class="cert-detail">
        <div class="cert-detail-row"><label>Certificate ID</label><span>#${c.id}</span></div>
        <div class="cert-detail-row"><label>Citizen Name</label><span>${c.citizen_name}</span></div>
        <div class="cert-detail-row"><label>Service</label><span>${c.service_name}</span></div>
        <div class="cert-detail-row"><label>Purpose</label><span>${c.purpose || '–'}</span></div>
        <div class="cert-detail-row"><label>Issued On</label><span>${formatDate(c.issued_at)}</span></div>
        <div class="cert-detail-row"><label>Valid Until</label><span>${c.expiry_date ? formatDate(c.expiry_date) : 'N/A'}</span></div>
        <div class="cert-detail-row"><label>Status</label><span style="color:#10b981;text-transform:uppercase">${c.status}</span></div>
      </div>`;
  } else {
    el.className = 'result invalid show';
    el.innerHTML = `
      <div class="result-icon"><i class="fas fa-times-circle"></i></div>
      <h2>❌ Certificate Not Valid</h2>
      <p style="color:#991b1b;font-size:.9rem">${data.message || 'This certificate could not be verified.'}</p>
      ${data.certificate ? `<div class="cert-detail">
        <div class="cert-detail-row"><label>Status</label><span style="color:#ef4444;text-transform:uppercase">${data.certificate.status}</span></div>
        <div class="cert-detail-row"><label>Service</label><span>${data.certificate.service_name}</span></div>
      </div>` : ''}`;
  }
}

function formatDate(d) {
  if (!d) return '–';
  return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' });
}
</script>
</body>
</html>
